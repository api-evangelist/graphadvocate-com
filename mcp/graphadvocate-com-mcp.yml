    prompts: {listChanged: false}
    resources: {listChanged: false}
  descriptor:
    name: Graph Advocate MCP
    status: healthy
    transport: sse
    description: >-
      Onchain data routing for The Graph Protocol. POST /mcp for one-shot JSON-RPC (initialize, tools/list);
      connect via SSE at /mcp/sse for full session.
  catalog_url: https://graphadvocate.com/mcp/catalog
  catalog_file: graphadvocate-com-mcp-catalog.json
auth:
  methods: [none]
  payment: x402 v2 — USDC on Base (eip155:8453); see conventions/ and plans/
