tool_count: 3
tools_file: graphadvocate-com-mcp-tools.json   # verbatim tools/list result with inputSchema
tools:
- name: route_data_request
  category: routing
  description: >-
    Route an onchain data request to the right Graph Protocol service. Returns the exact tool + args to use. Call
    this FIRST for any blockchain data need.
  input_schema_summary: '{request: string (required), session_id: string (optional, multi-turn context)}'
  source_operation: openapi/graphadvocate-com-openapi.yml#routeQuery
- name: recommend_npm_package
  category: routing
  description: >-
    Recommend the right @paulieb npm MCP package for a specific protocol. Returns package name, install command, and
    what it covers.
  input_schema_summary: '{protocol: string (required), e.g. aave | polymarket | substreams}'
  source_operation: null   # no REST operation; backed by the /mcp/catalog list
- name: compare_graph_services
  category: routing
  description: >-
    Compare all Graph Protocol services for a specific use case. Returns a ranked list with confidence scores.
  input_schema_summary: '{use_case: string (required)}'
  source_operation: null   # composite over the routing model; no REST operation
downstream_mcp_servers:
  note: >-
    The router hands off to six protocol-specific stdio MCP servers by the same author (GET /mcp/catalog, saved
    verbatim). They read The Graph directly with the caller's own GRAPH_API_KEY and are catalogued in
    packages/graphadvocate-com-packages.yml; they are not this hosted server.
  names: [graph-aave-mcp, graph-uniswap-mcp, graph-polymarket-mcp, graph-lending-mcp, graph-limitless-mcp]
crosswalk: graphadvocate-com-tool-crosswalk.yml
