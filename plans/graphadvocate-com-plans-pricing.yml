summary: >-
  No subscription tiers. Graph Advocate is pay-per-call: a free routing allowance of 3 queries/day per
  wallet-identified sender on the A2A endpoint, then $0.01 USDC per routed query, plus 21 further paid endpoints
  priced $0.01–$0.10 USDC each with no free tier. Settlement is x402 on Base; there is no signup, card, invoice or
  account. Pricing is published in prose, in a machine-readable capability file and inside the OpenAPI itself.
