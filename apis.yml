apis:
- name: Graph Advocate API
  description: >-
    Routing and trader-intelligence API at graphadvocate.com. POST / speaks A2A JSON-RPC 2.0 (message/send) and is the
    free tier (3 routed queries/day per wallet-identified sender); POST /route and 22 further POST endpoints
    (/hyperliquid/*, /polymarket/*, /kalshi/*, /uniswap/*, /predmarket/spread, /narrative/divergence, /ask,
    /onchain-x402/address, /agent/score) are x402-gated at $0.01-$0.10 USDC on Base and answer 402 with x402 v2
    PaymentRequirements until an X-PAYMENT header is presented. All 23 operations in the published OpenAPI 3.1.0 are
    read-style queries; there is no API key, OAuth or signup.
  image: https://graphadvocate.com/graphadvocate.png
  humanURL: https://docs.graphadvocate.com/
  baseURL: https://graphadvocate.com
