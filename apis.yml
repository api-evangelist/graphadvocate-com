aid: graphadvocate-com
name: PaulieB14
description: >-
  PaulieB14 (GitHub handle of the Graph Advocate author; provider.organization in the published A2A agent card)
  operates Graph Advocate, an onchain-data routing agent for The Graph Protocol at graphadvocate.com. Agents send a
  plain-English blockchain data question over A2A JSON-RPC 2.0, REST or MCP and receive the best subgraph among
  15,500+ indexed on The Graph, a ready-to-run GraphQL query and, on paid calls, the executed rows. Twenty-two paid
  endpoints add derived trader intelligence for Hyperliquid perps, Polymarket, Kalshi, Limitless and Uniswap plus
  natural-language SQL over x402 settlements on Base. There are no API keys or signups: paid calls settle in USDC on
  Base via x402 (HTTP 402 + PAYMENT-REQUIRED header), and the agent is registered as ERC-8004 agent #734 (Arbitrum)
  and #41034 (Base) under the ENS name graphadvocate.eth. The author also publishes six npx-installable MCP servers
  (Aave, Uniswap, Polymarket, lending, Limitless) that read The Graph directly.
