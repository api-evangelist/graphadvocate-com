apis:
- name: Graph Advocate MCP Server
  description: >-
    Hosted MCP server at https://graphadvocate.com/mcp (Streamable HTTP for one-shot JSON-RPC initialize
    and tools/list; SSE session at /mcp/sse). tools/list answers anonymously with three tools — route_data_request,
    recommend_npm_package and compare_graph_services — each carrying a real inputSchema. A stdio companion,
    graph-advocate-mcp 2.11.1 on npm, wraps the same routing surface for Claude Desktop, Cursor and other
    local MCP clients. GET /mcp/catalog lists the six protocol-specific MCP servers the router hands off
    to.
